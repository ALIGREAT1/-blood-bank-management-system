
{% extends 'bloodbank/base.html' %}

{% block content %}

<div class="content-card">
    <h2>{{ page_title|default:"Add Blood Request" }}</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            {{ button_text|default:"Save Blood Request" }}
        </button>

        <a href="{% url 'blood_request_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
