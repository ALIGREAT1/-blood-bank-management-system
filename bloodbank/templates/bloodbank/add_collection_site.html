
{% extends 'bloodbank/base.html' %}

{% block content %}

<div class="content-card">

    <h2>{{ page_title|default:"Add Collection Site" }}</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            {{ button_text|default:"Save Collection Site" }}
        </button>

        <a href="{% url 'collection_site_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
