
{% extends 'bloodbank/base.html' %}

{% block content %}

<div class="content-card">

    <h2>Delete Blood Request</h2>

    <p>
        Are you sure you want to delete blood request
        <strong>#{{ blood_request.requestid }}</strong>
        from <strong>{{ blood_request.hospital }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete Request
        </button>

        <a href="{% url 'blood_request_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
