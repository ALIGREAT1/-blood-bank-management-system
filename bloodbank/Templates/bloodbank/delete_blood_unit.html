{% extends 'bloodbank/base.html' %}

{% block title %}Delete Blood Unit{% endblock %}

{% block page_heading %}
<h1>Delete Blood Unit</h1>
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Confirm Deletion</h2>

    <p>
        Are you sure you want to delete Blood Unit
        <strong>#{{ blood_unit.bloodunitid }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>

        <a href="{% url 'blood_unit_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
