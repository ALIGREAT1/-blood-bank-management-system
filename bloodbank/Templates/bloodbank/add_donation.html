{% extends 'bloodbank/base.html' %}

{% block title %}Add Donation{% endblock %}

{% block page_heading %}
    <h1>{{ page_title|default:"Register Blood Donation" }}</h1>
{% endblock %}

{% block content %}

<div class="form-container">

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            {{ button_text|default:"Save Donation" }}
        </button>

        <a href="{% url 'donation_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
